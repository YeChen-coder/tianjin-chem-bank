<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>给妈妈的 AI 组卷</title>
<link rel="stylesheet" href="/static/katex/katex.min.css"><link rel="stylesheet" href="/static/question_editor_v2/editor.css"><link rel="stylesheet" href="/static/workflow_v2/workflow.css">
<script src="/static/katex/katex.min.js"></script><script src="/static/mathlive/mathlive.min.js"></script></head>
<body><header class="workspace-header"><a class="brand" href="/">给妈妈的 AI 组卷<span>化学试卷工作台</span></a><nav><a href="#library">导入试卷</a><a href="#app">整卷编辑</a><a href="#ai-panel">GLM 改写</a><button id="export-top" class="primary">导出 Word</button></nav></header>
<main class="workspace"><section id="library" class="library"><div><p class="eyebrow">从原卷到新试卷</p><h1>题目整理好，修改后就能导出。</h1><p class="lead">保留公式、配图、表格和答案。点击整卷中的内容编辑，保存后再改写或导出。</p></div><div class="steps"><span>① 导入 Word</span><span>② 逐题编辑与保存</span><span>③ GLM 改写与核对</span><span>④ 导出可编辑 Word</span></div>
<div class="library-actions"><label>选择试卷<select id="paper-select" aria-label="选择试卷"></select></label><label class="upload-button">导入新的 Word<input id="word-file" type="file" accept=".docx,.doc" hidden></label><a id="original-download" class="quiet-link">下载原卷对照</a><button id="refresh-library">刷新试卷</button></div><p id="paper-summary" class="muted"></p><p id="workspace-status" role="status" aria-live="polite"></p></section>
<details id="ai-panel" class="ai-panel"><summary>GLM 改写 · 查看候选，再决定是否采纳</summary><div class="ai-controls"><label>改写哪道题<select id="ai-question"></select></label><label>改写程度<select id="ai-intensity"><option value="light">轻：调整数字或设问</option><option value="medium">中：调整情景</option><option value="deep">深：重新设计情景</option></select></label><label class="feedback">给 GLM 的要求<textarea id="ai-feedback" rows="2" placeholder="例如：保留考点，换一组简单数字，答案与解析都要完整。"></textarea></label><button id="generate-ai" class="primary">用 GLM 改写并核对</button><button id="cancel-ai" hidden>取消本次改写</button></div><p id="ai-status" role="status" aria-live="polite"></p><p class="muted">改写结果先作为候选。GLM 会另行核对答案；你采纳后才会进入当前试卷，原题仍保留。</p><div id="candidates"></div></details>
<div id="app"></div></main><script type="module" src="/static/workflow_v2/workflow.js"></script></body></html>
